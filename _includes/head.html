<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <script>
    try {
      var preference = localStorage.getItem('crumbs-help-theme');
      if (preference === 'light' || preference === 'dark') document.documentElement.dataset.theme = preference;
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
