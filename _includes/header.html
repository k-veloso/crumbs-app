<header class="site-header" role="banner">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Crumbs Help home">
      {% if site.logo %}
      <img class="logo-light" src="{{ site.logo | relative_url }}" alt="Crumbs" width="1007" height="256">
      <img class="logo-dark" src="{{ '/assets/images/crumbs-lockup-horizontal-dark.svg' | relative_url }}" alt="Crumbs" width="1007" height="256">
      {% else %}
      <strong>{{ site.title | escape }}</strong>
      {% endif %}
      <span class="brand-divider" aria-hidden="true"></span><span class="brand-caption">Help center</span>
    </a>
    <nav class="header-nav" aria-label="Main navigation">
      <a href="{{ '/getting-started/' | relative_url }}"{% unless page.url == '/' or page.url == '/privacy/' or page.url == '/contact/' %} aria-current="true"{% endunless %}>Guides</a>
      <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
      <button class="theme-toggle" type="button" hidden>Theme: System</button>
    </nav>
  </div>
</header>
